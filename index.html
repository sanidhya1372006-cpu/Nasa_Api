<!DOCTYPE html>
<html>
<head>
  <title>NASA Space Images</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 1.2em;
    }

    .buttons {
      text-align: center;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 30px;
      margin: 5px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .image-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    #imageContainer {
      width: 100%;
      min-height: 400px;
      background: #000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #nasaImage {
      max-width: 100%;
      max-height: 600px;
      border-radius: 10px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 2em;
      color: #667eea;
      margin-bottom: 10px;
    }

    .date {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 1.1em;
    }

    .explanation {
      line-height: 1.8;
      color: #ddd;
    }

    .loading {
      color: #667eea;
      font-size: 1.5em;
    }

    .error {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌌 NASA APOD</h1>
    <p class="subtitle">Astronomy Picture of the Day</p>

    <div class="buttons">
      <button onclick="getTodayImage()">📅 Today's Image</button>
      <button onclick="getRandomImage()">🎲 Random Image</button>
    </div>

    <div class="image-box">
      <div id="imageContainer">
        <p class="loading">Loading amazing space image...</p>
      </div>
    </div>

    <div class="info-box" id="infoBox" style="display: none;">
      <h2 class="title" id="title"></h2>
      <p class="date" id="date"></p>
      <p class="explanation" id="explanation"></p>
    </div>
  </div>

  <script>
    // NASA API configuration
    const API_KEY = 'YwgXNuzS8gxQXNSftQc3B7pf99CKtbbp3EwncfSw';
    const API_URL = 'https://api.nasa.gov/planetary/apod';

    // Load today's image when page opens
    window.onload = function() {
      getTodayImage();
    };

    // Function to get today's image
    function getTodayImage() {
      showLoading();
      const url = `${API_URL}?api_key=${API_KEY}`;
      fetchImage(url);
    }

    // Function to get random image
    function getRandomImage() {
      showLoading();
      
      // Generate random date between 1995-06-16 and today
      const startDate = new Date('1995-06-16').getTime();
      const endDate = new Date().getTime();
      const randomTime = startDate + Math.random() * (endDate - startDate);
      const randomDate = new Date(randomTime).toISOString().split('T')[0];
      
      const url = `${API_URL}?api_key=${API_KEY}&date=${randomDate}`;
      fetchImage(url);
    }

    // Function to fetch image from API
    function fetchImage(url) {
      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.json();
        })
        .then(data => {
          displayImage(data);
        })
        .catch(error => {
          showError(error);
        });
    }

    // Function to display the image
    function displayImage(data) {
      const imageContainer = document.getElementById('imageContainer');
      const infoBox = document.getElementById('infoBox');

      // Check if it's an image or video
      if (data.media_type === 'image') {
        imageContainer.innerHTML = `
          <img src="${data.url}" alt="${data.title}" id="nasaImage">
        `;
      } else if (data.media_type === 'video') {
        imageContainer.innerHTML = `
          <iframe 
            src="${data.url}" 
            style="width: 100%; height: 400px; border: none; border-radius: 10px;"
            allowfullscreen>
          </iframe>
        `;
      }

      // Display information
      document.getElementById('title').textContent = data.title;
      document.getElementById('date').textContent = '📅 ' + data.date;
      document.getElementById('explanation').textContent = data.explanation;

      // Show info box
      infoBox.style.display = 'block';
    }

    // Function to show loading state
    function showLoading() {
      document.getElementById('imageContainer').innerHTML = 
        '<p class="loading">Loading...</p>';
      document.getElementById('infoBox').style.display = 'none';
    }

    // Function to show error
    function showError(error) {
      document.getElementById('imageContainer').innerHTML = `
        <div class="error">
          <h3>❌ Error Loading Image</h3>
          <p>${error.message}</p>
          <p>Try clicking the button again!</p>
        </div>
      `;
      console.error('Error:', error);
    }
  </script>
</body>
</html>
